<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#f7f9f7"
    />

    <meta
      name="description"
      content="Progress.ily — Plan your days, track your goals, and make consistent progress toward what matters."
    />

    <title>Progress.ily — Your Personal Productivity Space</title>

    <!-- Apply the saved / device theme before React loads, so dark mode never flashes white. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = JSON.parse(localStorage.getItem("progressily_theme"));
        } catch (e) {} // unreadable value: treat as "no saved theme"
        try {
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.background = dark ? "#0e1722" : "#fff";
        } catch (e) {}
      })();
    </script>

    <!-- App favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: DM Sans (body) and Manrope (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
